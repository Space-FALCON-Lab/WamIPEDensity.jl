name: Documentation

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      # The checked-in docs manifest was generated with Julia 1.12. Loading
      # it under 1.11 can prevent Pkg itself from loading (MbedTLS_jll).
      # Resolve from docs/Project.toml for this runner; retain the historical
      # manifest in Git rather than rewriting it from CI.
      - name: Prepare a Julia-compatible documentation environment
        run: rm docs/Manifest.toml
      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
