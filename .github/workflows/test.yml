name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      run_network_tests:
        description: Run the optional live archive and benchmark campaign
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Offline and archive regressions (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.11', '1.12']
    env:
      GKSwstype: '100'
      JULIA_NUM_THREADS: '2'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Install test dependencies in a fresh environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Load package and run strict local tests
        run: julia --project=test test/ci.jl

  network:
    if: github.event_name == 'workflow_dispatch' && inputs.run_network_tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Install test dependencies
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run optional live archive campaign
        run: julia --project=test test/runtests.jl
